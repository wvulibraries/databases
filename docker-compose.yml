version: '3.1'

services:

  elasticsearch:
    image: elasticsearch:7.17.10
    container_name: elasticsearch
    restart: always
    env_file:
      - './env/.env.prod.es'     
    volumes: 
      - ./search_data:/usr/share/elasticsearch/data
    ports: 
      - "9200"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
   
  db:
    image: mysql:5.7.27
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    container_name: databases_mysql
    restart: always
    ports:
      - "3310"
    env_file:
      - './env/.env.prod.db'  
    volumes:
      - ./mysql:/var/lib/mysql
      - ./mysql-files:/var/lib/mysql-files
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  
  rails: 
    build: 
      context: ./
      dockerfile: Dockerfile
    tty: true
    stdin_open: true
    container_name: databases_app
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: always
    env_file:
      - './env/.env.prod.rails'
    volumes:
      - ./:/home/databases
    ports:
      - "3000:3000" 
    links:
      - db
      - elasticsearch
